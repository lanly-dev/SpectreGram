<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpectreGram</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <section id="verdict" class="verdict" aria-live="polite"></section>

      <section id="spectrogram-box" class="spectrogram-box">
        <div id="ruler-left" class="ruler ruler-left" aria-hidden="true"></div>
        <section id="canvas-wrap" class="canvas-wrap">
          <canvas id="canvas" width="1024" height="512" aria-label="Spectrogram"></canvas>
          <div id="playhead" class="playhead" aria-hidden="true"></div>
        </section>
        <div id="ruler-bottom" class="ruler ruler-bottom" aria-hidden="true"></div>
      </section>
      <section id="folder-panel" class="folder-panel" hidden>
        <div class="folder-panel-header">
          <span id="folder-name"></span>
        </div>
        <ul id="folder-list" class="folder-list"></ul>
      </section>

      <section class="controls">
        <button id="palette-toggle" type="button">Palette: Spectrum</button>
        <button id="png-btn" type="button">Export PNG</button>
        <button id="play-btn" type="button">Play</button>
        <button id="stop-btn" type="button">Stop</button>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
