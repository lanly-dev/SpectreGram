<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpectreGram</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>SpectreGram</h1>
        <p class="tagline">Drop a file. See the truth. <em>Verdicts are estimates.</em></p>
      </header>

      <section
        id="dropzone"
        class="dropzone"
        tabindex="0"
        role="button"
        aria-label="Drop an audio file here, or activate to pick one"
      >
        <p class="dz-title">Drag &amp; drop an audio file here</p>
        <p class="dz-hint">mp3 · flac · wav · ogg · m4a — whatever your browser can decode</p>
        <p class="dz-hint">— or —</p>
        <button id="pick-btn" type="button">Pick a file</button>
        <input
          id="file-input"
          type="file"
          accept="audio/*,.flac,.mp3,.wav,.ogg,.m4a,.opus,.aac"
          hidden
        />
      </section>

      <section class="info" aria-live="polite">
        <div id="facts" class="facts"></div>
        <div id="status" class="status">Drop an audio file or pick one to begin.</div>
      </section>

      <section id="progress" class="progress" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </section>

      <section id="verdict" class="verdict" aria-live="polite"></section>

      <section id="canvas-wrap" class="canvas-wrap">
        <canvas id="canvas" width="1024" height="512" aria-label="Spectrogram"></canvas>
        <div id="playhead" class="playhead" aria-hidden="true"></div>
      </section>

      <section class="controls">
        <button id="palette-toggle" type="button">Palette: Hellfire</button>
        <button id="png-btn" type="button">Export PNG</button>
        <button id="play-btn" type="button">Play</button>
        <button id="stop-btn" type="button">Stop</button>
      </section>

      <footer>
        <p class="privacy">Your files never leave your machine. No uploads, no accounts.</p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
