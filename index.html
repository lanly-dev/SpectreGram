<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpectreGram</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="top-progress" aria-hidden="true">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <main>
      <section id="verdict" class="verdict" aria-live="polite"></section>

      <section id="facts" class="facts" aria-label="File facts"></section>

      <section id="spectrogram-box" class="spectrogram-box">
        <div id="ruler-left" class="ruler ruler-left" aria-hidden="true"></div>
        <section id="canvas-wrap" class="canvas-wrap">
          <canvas id="canvas" width="1024" height="512" aria-label="Spectrogram"></canvas>
          <div id="playhead" class="playhead" aria-hidden="true"><span class="playhead-ghost">👻</span></div>
          <div id="crosshair-v" class="crosshair crosshair-v" aria-hidden="true"></div>
          <div id="crosshair-h" class="crosshair crosshair-h" aria-hidden="true"></div>
          <div id="cursor-label" class="cursor-label" aria-hidden="true"></div>
          <div id="zoom-select" class="zoom-select" aria-hidden="true"></div>
          <div id="zoom-thumb" class="zoom-thumb" aria-hidden="true" hidden></div>
          <button
            id="zoom-reset"
            class="icon-btn zoom-reset"
            type="button"
            aria-label="Reset zoom to the full track"
            hidden
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M6 2.5H2.5V6M10 2.5h3.5V6M6 13.5H2.5V10M10 13.5h3.5V10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </section>
        <div id="empty-state" class="empty-state" aria-hidden="true">
          <div class="empty-ghost">👻</div>
          <div class="empty-text">Drop a file… if you dare</div>
        </div>
        <div id="ruler-bottom" class="ruler ruler-bottom" aria-hidden="true"></div>
        <div
          id="legend"
          class="legend"
          role="img"
          aria-label="dBFS color scale"
          title="dBFS scale — u / U: lower / raise upper limit, l / L: lower / raise lower limit"
        >
          <canvas id="legend-canvas" class="legend-canvas" width="10" height="256"></canvas>
          <div id="legend-ticks" class="legend-ticks" aria-hidden="true"></div>
        </div>
      </section>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

      <section id="folder-panel" class="folder-panel" hidden>
        <div class="folder-panel-header">
          <span id="folder-name"></span>
        </div>
        <ul id="folder-list" class="folder-list"></ul>
      </section>

      <section class="controls">
        <!-- Compact icon buttons; the label lives in aria-label + title (tooltip). -->
        <button
          id="palette-toggle"
          class="icon-btn palette-btn"
          type="button"
          aria-label="Palette: Spectrum (click to change)"
          title="Palette: Spectrum (click to change)"
        >
          <span id="palette-swatch" class="palette-swatch" aria-hidden="true"></span>
        </button>
        <button id="png-btn" class="icon-btn" type="button" aria-label="Export PNG" title="Export PNG">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <!-- One toggle: shows the play icon while stopped, the stop icon while playing. -->
        <button id="play-btn" class="icon-btn play-btn" type="button" aria-label="Play" title="Play">
          <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M5 3.2v9.6L12.6 8z" fill="currentColor" />
          </svg>
          <svg class="icon-stop" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor" />
          </svg>
        </button>
      </section>

      <div id="screensaver" class="screensaver" hidden>
        <video
          id="screensaver-video"
          src="screensaver.mp4"
          loop
          muted
          playsinline
          preload="none"
          aria-hidden="true"
        ></video>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
