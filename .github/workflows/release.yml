# Build the desktop app for Windows, Linux and macOS and attach the results
# to a DRAFT GitHub Release. Runs when a version tag like 1.0.0 is pushed (or manually).
# Spec: .kiro/specs/submission-readiness/ (task 4). All builds are unsigned.
name: Release desktop builds

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            files: |
              release/*.exe
          - os: ubuntu-latest
            name: linux
            files: |
              release/*.AppImage
          - os: macos-latest
            name: macos
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored in this repo; versions are pinned
      # exactly in package.json instead.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test (cutoff detector)
        run: npm run test

      - name: Package
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: spectregram-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
