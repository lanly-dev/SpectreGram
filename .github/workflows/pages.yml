# Deploy the web build (dist/) to GitHub Pages — the no-install demo of the
# same renderer the desktop app ships. Spec: .kiro/specs/submission-readiness/
# (R2, task 3). vite.config.ts uses base './', so the app and its module
# worker load from the Pages subpath.
name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored in this repo, so `npm ci` can't run.
      # Dependency versions are pinned exactly in package.json instead.
      # The web build doesn't need the Electron binary, so skip its download.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Test (cutoff detector)
        run: npm run test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
